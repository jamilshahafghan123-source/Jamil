# Cloud Build pipeline: test, build, push, deploy.
#
# Trigger on push to your main branch:
#   gcloud builds triggers create github \
#     --repo-name=jamil --repo-owner=jamilshahafghan123-source \
#     --branch-pattern='^main$' --build-config=deploy/cloudbuild.yaml
#
# Substitutions can be overridden per-trigger.

substitutions:
  _REGION: europe-west1
  _REPO: mt5ai
  _SQL_CONN: "" # PROJECT:REGION:INSTANCE
  _CONNECTOR: mt5ai-connector
  _MT5_BRIDGE_URL: "" # http://10.128.0.5:8100

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ---- test before building anything -------------------------------
  - id: backend-tests
    name: python:3.12-slim
    dir: backend
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r requirements.txt pytest
        python -m pytest -q

  - id: frontend-typecheck
    name: node:22-alpine
    dir: frontend
    entrypoint: sh
    args:
      - -c
      - |
        npm ci --no-audit --no-fund || npm install --no-audit --no-fund
        npm run build

  # ---- build ---------------------------------------------------------
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - ./backend
    waitFor: ["backend-tests"]

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest
      - ./frontend
    waitFor: ["frontend-typecheck"]

  # ---- push ----------------------------------------------------------
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend
        docker push --all-tags ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend
    waitFor: ["build-backend", "build-frontend"]

  # ---- deploy ---------------------------------------------------------
  # ALLOW_REAL_TRADING is pinned false here on purpose: a routine deploy
  # must never be able to silently arm live trading.
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mt5ai-backend
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --add-cloudsql-instances=${_SQL_CONN}
      - --vpc-connector=${_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --min-instances=1
      - --max-instances=1
      - --set-env-vars=ENV=prod,SYMBOL=XAUUSD,ALLOW_REAL_TRADING=false,MT5_BRIDGE_URL=${_MT5_BRIDGE_URL}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,MT5_BRIDGE_TOKEN=MT5_BRIDGE_TOKEN:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
    waitFor: ["push"]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        BACKEND_URL=$(gcloud run services describe mt5ai-backend \
          --region=${_REGION} --format='value(status.url)')
        gcloud run deploy mt5ai-frontend \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA \
          --region=${_REGION} --platform=managed --allow-unauthenticated \
          --max-instances=3 \
          --set-env-vars=BACKEND_URL=$$BACKEND_URL,PORT=8080
    waitFor: ["deploy-backend"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA

timeout: 1800s

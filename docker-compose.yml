# Local development stack: Postgres + backend + frontend.
#
# The MT5 bridge is NOT here — it must run on Windows next to the MetaTrader 5
# terminal. Start it separately (mt5-bridge/run_bridge.bat) and point
# MT5_BRIDGE_URL at it.
#
#   cp .env.example .env   # fill it in
#   docker compose up --build
#   open http://localhost:8081

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mt5ai
      POSTGRES_PASSWORD: mt5ai
      POSTGRES_DB: mt5ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt5ai"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mt5ai:mt5ai@db:5432/mt5ai
      PORT: "8080"
      # host.docker.internal reaches the Windows host from the container.
      MT5_BRIDGE_URL: ${MT5_BRIDGE_URL:-http://host.docker.internal:8100}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      PORT: "8080"
    depends_on:
      - backend
    ports:
      - "8081:8080"

volumes:
  pgdata:
